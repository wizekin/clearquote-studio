name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/792874189437/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-firebase-deploy@wisenkin.iam.gserviceaccount.com

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check portfolio calculations and pages
        run: |
          node --test tests/models.test.cjs tests/collection.test.cjs
          python3 scripts/check_portfolio.py

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@15.22.1 deploy --only hosting --project wisenkin --non-interactive

      - name: Notify IndexNow of new and updated public pages
        if: github.event_name == 'push'
        continue-on-error: true
        run: python3 scripts/notify_indexnow.py
